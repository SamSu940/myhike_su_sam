<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | Sam’s MyHike</title>

    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>
    <site-navbar></site-navbar>

    <main class="container py-4">
        <header class="d-flex align-items-center gap-3 mb-4">
            <span id="avatar" class="rounded-circle bg-info px-3 py-2 fw-bold" aria-hidden="true"></span>
            <div>
                <h1 id="profileName" class="h4 mb-0">My profile</h1>
                <p id="profileEmail" class="text-muted mb-0"></p>
            </div>
        </header>

        <section class="border rounded p-3">
            <h2 class="h5">About me</h2>

            <div id="profileAlert" class="alert alert-success d-none" role="status"></div>

            <form id="profileForm">
                <div class="mb-3">
                    <label for="nameInput" class="form-label">Name</label>
                    <input id="nameInput" class="form-control" type="text" disabled>
                </div>

                <div class="mb-3">
                    <label for="countryInput" class="form-label">Country</label>
                    <input id="countryInput" class="form-control" type="text" disabled>
                </div>

                <div class="mb-3">
                    <label for="schoolInput" class="form-label">School</label>
                    <input id="schoolInput" class="form-control" type="text" disabled>
                </div>

                <div class="mb-3">
                    <label for="bioInput" class="form-label">About me</label>
                    <textarea id="bioInput" class="form-control" rows="3" disabled></textarea>
                </div>

                <button id="editBtn" type="button" class="btn btn-outline-secondary">
                    Edit
                </button>
                <button id="saveBtn" type="submit" class="btn btn-success" disabled>
                    Save
                </button>
            </form>
        </section>

        <section class="mt-4" aria-labelledby="favourites-heading">
            <h2 id="favourites-heading" class="h5">My favourite hikes</h2>
            <div id="hikes-go-here" class="row g-3"></div>
        </section>

        <template id="hikeCardTemplate">
            <div class="col">
                <div class="card h-100">
                    <img class="card-img-top card-image" alt="Hike image" style="height: 180px; object-fit: cover;">
                    <i class="bi bi-heart text-danger fs-4 fav-btn position-absolute top-0 end-0 m-2" role="button"
                        title="Favourite"></i>

                    <div class="card-body">
                        <h5 class="card-title"></h5>
                        <p class="card-text"></p>
                        <p>Length: <span class="card-length"></span> km</p>
                        <a class="btn btn-primary read-more" href="#">
                            Read More
                        </a>
                    </div>
                </div>
            </div>
        </template>

    </main>

    <site-footer></site-footer>
    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/profile.js"></script>
</body>

</html>
