<!DOCTYPE html>
<html lang="en">

<head>
    <title>Main | Sam’s MyHike</title>
    <meta name="comp1800 template" content="My 1800 App">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>
    <site-navbar></site-navbar>

    <!-- Personalized greeting -->
    <div class="container-fluid bg-light text-dark p-5">
        <div class="container bg-light p-5">
            <h1 class="display-4">
                Good morning <span id="name-goes-here">friend</span>
            </h1>
            <p>You are logged in to Sam’s MyHike.</p>
            <hr>
            <p>Quote of the day: <span id="quote-goes-here"></span></p>
        </div>
    </div>
    <section class="container py-4">
        <a href="./addHike.html" class="btn btn-primary mb-3">
            ➕ Add a hike
        </a>
        <h2>Popular Hikes</h2>

        <div id="hikes-go-here" class="row row-cols-1 row-cols-md-3 g-4">
        </div>
    </section>

    <template id="hikeCardTemplate">
        <div class="col">
            <div class="card h-100">
                <img class="card-img-top card-image" alt="Hike image" style="height: 180px; object-fit: cover;">
                <i class="bi bi-heart text-danger fs-4 fav-btn position-absolute top-0 end-0 m-2" role="button"
                    title="Favourite"></i>

                <div class="card-body">
                    <h5 class="card-title"></h5>
                    <p class="card-text"></p>
                    <p>Length: <span class="card-length"></span> km</p>
                    <a class="btn btn-primary read-more" href="#">
                        Read More
                    </a>
                </div>
            </div>
        </div>
    </template>

    <site-footer></site-footer>

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
